name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # a few seconds; a red test stops the deploy
      - run: npm test
      - run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          printf "Host *\n  IdentityFile ~/.ssh/id_deploy\n" > ~/.ssh/config

      # Static site: Caddy serves /srv/e1-pixel-pit directly, no container to restart.
      - name: Upload
        run: |
          ssh "$TARGET" 'mkdir -p /srv/e1-pixel-pit'
          rsync -az --delete dist/ "$TARGET:/srv/e1-pixel-pit/"
